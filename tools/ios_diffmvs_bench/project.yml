name: DiffMVSBench
options:
  bundleIdPrefix: com.pocketworld
  deploymentTarget:
    iOS: "17.0"
targets:
  DiffMVSBench:
    type: application
    platform: iOS
    sources:
      - DiffMVSBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketworld.diffmvsbench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Used for the ARKit SLAM coverage preview (red/yellow/green feature-point feedback)."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 26AH7V448L
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: DiffMVSBench/DiffMVSBench-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
