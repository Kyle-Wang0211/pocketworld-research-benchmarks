[project]
name = "pocketworld-contract"
version = "0.1.0"
description = "Deterministic local verifier for PocketWorld research assets"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema==4.25.1",
    "numpy==2.4.2",
]

[project.scripts]
pocketworld-contract = "pocketworld_contract.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "EM", "S101", "T201", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
