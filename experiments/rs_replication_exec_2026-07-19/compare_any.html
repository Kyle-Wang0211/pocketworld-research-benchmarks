<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>同 gauge 对照(通用):左基准 vs 右候选</title>
<style>
  body { margin:0; background:#101014; color:#ddd; font:13px -apple-system,sans-serif; overflow:hidden; }
  #hud { position:fixed; top:0; left:0; right:0; padding:8px 12px; background:rgba(16,16,20,.9); z-index:10; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  button { background:#22242c; color:#ddd; border:1px solid #444; border-radius:4px; padding:4px 10px; cursor:pointer; }
  button.active { background:#2e5f8a; border-color:#7fd4ff; }
  #panes { display:flex; height:100vh; }
  .pane { position:relative; width:50%; height:100%; }
  .pane + .pane { border-left:1px solid #333; }
  .label { position:absolute; top:44px; left:10px; z-index:5; font-weight:bold; padding:2px 8px; border-radius:4px; background:rgba(0,0,0,.5); }
  .label.orig { color:#7fd4ff; }
  .label.cand { color:#ffb054; }
  .count { position:absolute; bottom:8px; left:10px; z-index:5; color:#9a9; }
  canvas { display:block; width:100%; height:100%; }
  #delta { color:#e0b060; }
</style>
</head>
<body>
<div id="hud">
  <b>同 gauge 对照</b>
  <span id="viewbtns"></span>
  <span id="delta">loading…</span>
  <span style="color:#777">拖拽=旋转 滚轮=缩放 shift拖=平移(双栏同步)· 1-4 切视角 · 同一世界坐标直出,无任何对齐</span>
</div>
<div id="panes">
  <div class="pane"><div class="label orig" id="leftLabel">左</div><div class="count" id="c0"></div><canvas id="cv0"></canvas></div>
  <div class="pane"><div class="label cand" id="candLabel">右</div><div class="count" id="c1"></div><canvas id="cv1"></canvas></div>
</div>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const LEFT = q.get('left');
const RIGHT = q.get('right');
if(!LEFT || !RIGHT){ document.getElementById('delta').textContent = 'ERROR: 需要 ?left=…&right=…(两个 PLY 路径,同一场景同一 gauge)'; throw new Error('missing params'); }
document.getElementById('leftLabel').textContent = '基准:' + (q.get('llabel') || LEFT.split('/').pop());
document.getElementById('candLabel').textContent = '候选:' + (q.get('rlabel') || RIGHT.split('/').pop());

const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm3=a=>{const l=Math.hypot(...a);return [a[0]/l,a[1]/l,a[2]/l];};
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], scale3=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
function lookAt(e,t){ const z=norm3(sub3(e,t)), x=norm3(cross3([0,1,0],z)), y=cross3(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot3(x,e),-dot3(y,e),-dot3(z,e),1]); }
function persp(fovy,asp,n,f){ const t=1/Math.tan(fovy*Math.PI/360);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]); }
function m4mul(a,b){ const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;} return o; }

// stride 感知 PLY 解析:按 header property 表算偏移,支持 float/double/uchar 混排;ascii 兜底
function parsePLY(buf){
  const u8=new Uint8Array(buf), hdrEnd=(()=>{ const s=new TextDecoder().decode(u8.slice(0,8192)); const i=s.indexOf('end_header\n'); if(i<0) throw 'bad PLY header'; return i+11; })();
  const hdr=new TextDecoder().decode(u8.slice(0,hdrEnd));
  const n=+hdr.match(/element vertex (\d+)/)[1];
  const ascii=/format ascii/.test(hdr);
  const SZ={float:4,float32:4,double:8,float64:8,uchar:1,uint8:1,char:1,int8:1,short:2,ushort:2,int:4,uint:4,int32:4,uint32:4};
  const props=[]; let stride=0;
  for(const line of hdr.split('\n')){ const m=line.match(/^property\s+(\w+)\s+(\w+)/);
    if(m){ props.push({type:m[1],name:m[2],off:stride,idx:props.length}); stride+=SZ[m[1]]||4; } }
  const P={}; for(const p of props) P[p.name]=p;
  const need=['x','y','z']; for(const k of need) if(!P[k]) throw 'PLY missing '+k;
  const hasCol=P.red&&P.green&&P.blue;
  const pos=new Float32Array(n*3), col=new Float32Array(n*3);
  if(ascii){
    const text=new TextDecoder().decode(u8.slice(hdrEnd));
    const lines=text.split('\n');
    for(let i=0;i<n;i++){ const t=lines[i].trim().split(/\s+/);
      pos[i*3]=+t[P.x.idx]; pos[i*3+1]=+t[P.y.idx]; pos[i*3+2]=+t[P.z.idx];
      if(hasCol){ col[i*3]=+t[P.red.idx]/255; col[i*3+1]=+t[P.green.idx]/255; col[i*3+2]=+t[P.blue.idx]/255; }
      else { col[i*3]=col[i*3+1]=col[i*3+2]=0.8; } }
  } else {
    const dv=new DataView(buf,hdrEnd);
    const rd=(p,b)=>{ switch(p.type){ case 'double': case 'float64': return dv.getFloat64(b+p.off,true);
      case 'uchar': case 'uint8': return dv.getUint8(b+p.off); default: return dv.getFloat32(b+p.off,true); } };
    for(let i=0;i<n;i++){ const b=i*stride;
      pos[i*3]=rd(P.x,b); pos[i*3+1]=rd(P.y,b); pos[i*3+2]=rd(P.z,b);
      if(hasCol){ col[i*3]=rd(P.red,b)/255; col[i*3+1]=rd(P.green,b)/255; col[i*3+2]=rd(P.blue,b)/255; }
      else { col[i*3]=col[i*3+1]=col[i*3+2]=0.8; } }
  }
  return {n,pos,col};
}

const VS=`attribute vec3 p; attribute vec3 col; uniform mat4 mvp; varying vec3 vc;
void main(){ gl_Position=mvp*vec4(p,1.0); gl_PointSize=2.0*${devicePixelRatio.toFixed(1)}; vc=col; }`;
const FS=`precision mediump float; varying vec3 vc; void main(){ gl_FragColor=vec4(vc,1.0); }`;

function makePane(canvasId, data){
  const canvas=document.getElementById(canvasId);
  const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
  function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
  const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  for(const [name,arr] of [['p',data.pos],['col',data.col]]){ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW); const loc=gl.getAttribLocation(prog,name);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0); }
  return {canvas,gl,prog,n:data.n};
}

let views=null, cam=null, panes=[];
function draw(){ if(!cam) return;
  for(const p of panes){
    const {canvas,gl,prog}=p;
    const W=canvas.clientWidth*devicePixelRatio, H=canvas.clientHeight*devicePixelRatio;
    if(canvas.width!==W||canvas.height!==H){ canvas.width=W; canvas.height=H; }
    gl.viewport(0,0,W,H);
    gl.clearColor(0.063,0.063,0.078,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    const d=Math.hypot(...sub3(cam.eye,cam.target));
    const mvp=m4mul(persp(cam.fov,W/H,d*0.001,d*20), lookAt(cam.eye,cam.target));
    gl.uniformMatrix4fv(gl.getUniformLocation(prog,'mvp'),false,mvp);
    gl.drawArrays(gl.POINTS,0,p.n);
  } }
addEventListener('resize',draw);

function setView(name){ const v=views[name]; cam={eye:[...v.eye],target:[...v.target],fov:v.fov};
  document.querySelectorAll('#viewbtns button').forEach(b=>b.classList.toggle('active',b.textContent===name));
  draw(); }

let drag=null;
addEventListener('mousedown',e=>{ if(e.target.tagName==='CANVAS') drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}; });
addEventListener('mouseup',()=>drag=null);
addEventListener('mousemove',e=>{ if(!drag||!cam) return;
  const dx=(e.clientX-drag.x)/innerWidth, dy=(e.clientY-drag.y)/innerHeight; drag.x=e.clientX; drag.y=e.clientY;
  let off=sub3(cam.eye,cam.target);
  if(drag.shift){ const d=Math.hypot(...off), z=norm3(off), x=norm3(cross3([0,1,0],z)), y=cross3(z,x);
    const m=add3(scale3(x,-dx*d),scale3(y,dy*d)); cam.eye=add3(cam.eye,m); cam.target=add3(cam.target,m); }
  else{ const r=Math.hypot(...off); let th=Math.atan2(off[0],off[2]), ph=Math.asin(off[1]/r);
    th-=dx*4; ph=Math.max(-1.55,Math.min(1.55,ph+dy*3));
    cam.eye=add3(cam.target,[r*Math.cos(ph)*Math.sin(th), r*Math.sin(ph), r*Math.cos(ph)*Math.cos(th)]); }
  draw(); });
addEventListener('wheel',e=>{ if(e.target.tagName!=='CANVAS'||!cam) return; e.preventDefault();
  const off=sub3(cam.eye,cam.target), s=Math.exp(e.deltaY*0.001);
  cam.eye=add3(cam.target,scale3(off,s)); draw(); },{passive:false});

// 从两云联合包围盒自动生成 4 个预设视角(同一世界坐标,双栏同一相机)
function buildViews(L,R){
  const lo=[1/0,1/0,1/0], hi=[-1/0,-1/0,-1/0];
  for(const d of [L,R]) for(let i=0;i<d.n;i++) for(let k=0;k<3;k++){
    const v=d.pos[i*3+k]; if(v<lo[k])lo[k]=v; if(v>hi[k])hi[k]=v; }
  const c=[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2,(lo[2]+hi[2])/2];
  const ext=Math.max(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2]);
  const r=ext*1.1;
  return {
    overview:{eye:add3(c,[r*0.8,r*0.55,r*0.8]),target:c,fov:50},
    top:{eye:add3(c,[0.001,r*1.4,0.001]),target:c,fov:50},
    front:{eye:add3(c,[0,r*0.15,r*1.3]),target:c,fov:50},
    side:{eye:add3(c,[r*1.3,r*0.15,0]),target:c,fov:50},
  };
}

async function main(){
  const [lb, rb]=await Promise.all([
    fetch(LEFT).then(r=>{if(!r.ok)throw 'LEFT 404: '+LEFT;return r.arrayBuffer()}),
    fetch(RIGHT).then(r=>{if(!r.ok)throw 'RIGHT 404: '+RIGHT;return r.arrayBuffer()})]);
  const L=parsePLY(lb), R=parsePLY(rb);
  views=buildViews(L,R);
  panes=[makePane('cv0',L), makePane('cv1',R)];
  document.getElementById('c0').textContent=L.n.toLocaleString()+' pts';
  document.getElementById('c1').textContent=R.n.toLocaleString()+' pts';
  const d=R.n-L.n;
  document.getElementById('delta').textContent=`Δ点数 ${d>=0?'+':''}${d.toLocaleString()} (${(100*d/L.n).toFixed(2)}%)`;
  const vb=document.getElementById('viewbtns');
  for(const name of Object.keys(views)){ const b=document.createElement('button');
    b.textContent=name; b.onclick=()=>setView(name); vb.appendChild(b); }
  addEventListener('keydown',e=>{ const ks=Object.keys(views); const i=+e.key-1; if(ks[i]) setView(ks[i]); });
  setView('overview');
  window.compareReady=true;
}
main().catch(e=>{ document.getElementById('delta').textContent='ERROR: '+e; });
</script>
</body>
</html>
