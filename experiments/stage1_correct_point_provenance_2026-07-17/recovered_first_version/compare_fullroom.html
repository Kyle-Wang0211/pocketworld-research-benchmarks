<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketWorld 首版全房间逐层对照</title>
<style>
  body { margin:0; background:#101014; color:#ddd; font:13px -apple-system,sans-serif; overflow:hidden; }
  #hud { position:fixed; top:0; left:0; right:0; min-height:34px; padding:8px 12px; background:rgba(16,16,20,.92); z-index:10; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  button { background:#22242c; color:#ddd; border:1px solid #444; border-radius:4px; padding:4px 10px; cursor:pointer; }
  button.active { background:#2e5f8a; border-color:#7fd4ff; }
  #panes { display:flex; height:100vh; }
  .pane { position:relative; width:50%; height:100%; }
  .pane + .pane { border-left:1px solid #333; }
  .label { position:absolute; top:54px; left:10px; z-index:5; font-weight:bold; padding:2px 8px; border-radius:4px; background:rgba(0,0,0,.62); }
  .label.orig { color:#7fd4ff; }
  .label.cand { color:#ffb054; }
  .count { position:absolute; bottom:8px; left:10px; z-index:5; color:#9a9; }
  canvas { display:block; width:100%; height:100%; }
  #delta { color:#e0b060; }
</style>
</head>
<body>
<div id="hud">
  <b id="title">全房间首版对照</b>
  <span id="viewbtns"></span>
  <span id="delta">loading…</span>
  <span style="color:#777">左右严格同坐标同相机 · 拖拽旋转 · Shift 拖拽平移 · 滚轮缩放</span>
</div>
<div id="panes">
  <div class="pane"><div class="label orig">设备生产原版（逐字节不动）</div><div class="count" id="c0"></div><canvas id="cv0"></canvas></div>
  <div class="pane"><div class="label cand" id="candLabel">候选</div><div class="count" id="c1"></div><canvas id="cv1"></canvas></div>
</div>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const LEFT = q.get('left');
const RIGHT = q.get('right');
const CAPTURE = q.get('capture') || 'capture';
const RLABEL = q.get('label') || (RIGHT ? RIGHT.split('/').pop() : '候选');
if (!LEFT || !RIGHT) throw new Error('URL 必须提供 left 和 right');
document.getElementById('title').textContent = CAPTURE + ' · 首版逐层对照';
document.getElementById('candLabel').textContent = RLABEL;

const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm3=a=>{const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], scale3=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
function lookAt(e,t){ let up=[0,1,0], z=norm3(sub3(e,t)); if(Math.abs(dot3(up,z))>.98) up=[0,0,1]; const x=norm3(cross3(up,z)), y=cross3(z,x); return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot3(x,e),-dot3(y,e),-dot3(z,e),1]); }
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy*Math.PI/360);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);}
function m4mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function parsePLY(buf){const u8=new Uint8Array(buf),hdr=new TextDecoder().decode(u8.slice(0,4096));const n=+hdr.match(/element vertex (\d+)/)[1],off=hdr.indexOf('end_header\n')+11;const pos=new Float32Array(n*3),col=new Float32Array(n*3),dv=new DataView(buf,off);for(let i=0;i<n;i++){const b=i*15;pos[i*3]=dv.getFloat32(b,true);pos[i*3+1]=dv.getFloat32(b+4,true);pos[i*3+2]=dv.getFloat32(b+8,true);col[i*3]=dv.getUint8(b+12)/255;col[i*3+1]=dv.getUint8(b+13)/255;col[i*3+2]=dv.getUint8(b+14)/255;}return {n,pos,col};}
function percentile(values,p){const a=[...values].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.floor(p*(a.length-1))))];}
function robustFrame(data){const stride=Math.max(1,Math.floor(data.n/20000)),xs=[],ys=[],zs=[];for(let i=0;i<data.n;i+=stride){xs.push(data.pos[i*3]);ys.push(data.pos[i*3+1]);zs.push(data.pos[i*3+2]);}const lo=[percentile(xs,.02),percentile(ys,.02),percentile(zs,.02)],hi=[percentile(xs,.98),percentile(ys,.98),percentile(zs,.98)],target=lo.map((v,i)=>(v+hi[i])/2),r=Math.max(...hi.map((v,i)=>v-lo[i]))*.72;return {target,r:Math.max(r,.01)};}
const VS=`attribute vec3 p;attribute vec3 col;uniform mat4 mvp;varying vec3 vc;void main(){gl_Position=mvp*vec4(p,1.0);gl_PointSize=2.0*${devicePixelRatio.toFixed(1)};vc=col;}`;
const FS=`precision mediump float;varying vec3 vc;void main(){gl_FragColor=vec4(vc,1.0);}`;
function makePane(canvasId,data){const canvas=document.getElementById(canvasId),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);for(const [name,arr] of [['p',data.pos],['col',data.col]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);}return {canvas,gl,prog,n:data.n};}
let cam=null,panes=[],views={};
function draw(){if(!cam)return;for(const p of panes){const {canvas,gl,prog}=p,W=canvas.clientWidth*devicePixelRatio,H=canvas.clientHeight*devicePixelRatio;if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}gl.viewport(0,0,W,H);gl.clearColor(.063,.063,.078,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);const d=Math.hypot(...sub3(cam.eye,cam.target));gl.uniformMatrix4fv(gl.getUniformLocation(prog,'mvp'),false,m4mul(persp(cam.fov,W/H,d*.001,d*20),lookAt(cam.eye,cam.target)));gl.drawArrays(gl.POINTS,0,p.n);}}
function setView(name){const v=views[name];cam={eye:[...v.eye],target:[...v.target],fov:v.fov};document.querySelectorAll('#viewbtns button').forEach(b=>b.classList.toggle('active',b.textContent===name));draw();}
let drag=null;addEventListener('mousedown',e=>{if(e.target.tagName==='CANVAS')drag={x:e.clientX,y:e.clientY,shift:e.shiftKey};});addEventListener('mouseup',()=>drag=null);addEventListener('mousemove',e=>{if(!drag||!cam)return;const dx=(e.clientX-drag.x)/innerWidth,dy=(e.clientY-drag.y)/innerHeight;drag.x=e.clientX;drag.y=e.clientY;let off=sub3(cam.eye,cam.target);if(drag.shift){const d=Math.hypot(...off),z=norm3(off),x=norm3(cross3([0,1,0],z)),y=cross3(z,x),m=add3(scale3(x,-dx*d),scale3(y,dy*d));cam.eye=add3(cam.eye,m);cam.target=add3(cam.target,m);}else{const r=Math.hypot(...off);let th=Math.atan2(off[0],off[2]),ph=Math.asin(off[1]/r);th-=dx*4;ph=Math.max(-1.55,Math.min(1.55,ph+dy*3));cam.eye=add3(cam.target,[r*Math.cos(ph)*Math.sin(th),r*Math.sin(ph),r*Math.cos(ph)*Math.cos(th)]);}draw();});addEventListener('wheel',e=>{if(e.target.tagName!=='CANVAS'||!cam)return;e.preventDefault();cam.eye=add3(cam.target,scale3(sub3(cam.eye,cam.target),Math.exp(e.deltaY*.001)));draw();},{passive:false});addEventListener('resize',draw);
async function main(){const [lb,rb]=await Promise.all([fetch(LEFT).then(r=>{if(!r.ok)throw new Error('LEFT '+r.status);return r.arrayBuffer();}),fetch(RIGHT).then(r=>{if(!r.ok)throw new Error('RIGHT '+r.status);return r.arrayBuffer();})]);const L=parsePLY(lb),R=parsePLY(rb),f=robustFrame(L),t=f.target,r=f.r;views={overview:{eye:add3(t,[1.55*r,1.0*r,1.55*r]),target:t,fov:42},X侧视:{eye:add3(t,[2.7*r,0,0]),target:t,fov:35},Y侧视:{eye:add3(t,[0,2.7*r,0]),target:t,fov:35},Z侧视:{eye:add3(t,[0,0,2.7*r]),target:t,fov:35}};panes=[makePane('cv0',L),makePane('cv1',R)];document.getElementById('c0').textContent=L.n.toLocaleString()+' pts';document.getElementById('c1').textContent=R.n.toLocaleString()+' pts';const d=R.n-L.n;document.getElementById('delta').textContent=`Δ点数 ${d>=0?'+':''}${d.toLocaleString()} (${(100*d/L.n).toFixed(2)}%)`;for(const name of Object.keys(views)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>setView(name);document.getElementById('viewbtns').appendChild(b);}setView('overview');window.compareReady=true;}
main().catch(e=>document.getElementById('delta').textContent='ERROR: '+e.message);
</script>
</body>
</html>
