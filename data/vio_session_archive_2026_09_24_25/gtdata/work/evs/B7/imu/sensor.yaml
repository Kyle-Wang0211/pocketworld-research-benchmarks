%YAML 1.0
# sense-slam sensor.yaml
type: imu
description: iPhone X
frequency: 100  # [hz]

# noise parameters
intrinsic:
  sigma_w: 0.005  # [rad/s/sqrt(hz)]
  sigma_bw: 4e-04  # [rad/s^2/sqrt(hz)]
  sigma_a: 0.1  # [m/s^2/sqrt(hz)]
  sigma_ba: 0.1  # [m/s^3/sqrt(hz)]

# sensor to body transform
extrinsic:
  q: [0, 0, 0, 1]  # x y z w
  p: [0, 0, 0]  # [m]
  t: 0  # [s]
