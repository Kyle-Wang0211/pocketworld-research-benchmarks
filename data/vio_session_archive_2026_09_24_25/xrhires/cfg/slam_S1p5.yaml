%YAML:1.0
output:
  q_bo: [ 0, 0, 0, 1 ] # x y z w
  p_bo: [ 0, 0, 0 ] # x y z [m]

feature_tracker:
  min_keypoint_distance: 37.5   # [xrhires] official 25.0 x 1.5 (px scaled with resolution)
  max_keypoint_detection: 300
  max_frames: 100

solver:
  time_limit: 0.1
  iteration_limit: 10

sliding_window:
  size: 5
  tracker_frequent: 3
  rpe_threshold_px: 4.50   # [xrhires] code default 3.0 x 1.5 (TT_VALID gate, px)
  rpe_reference_focal: 0.0

visual_localization:
  enable: false
  ip: "10.156.16.69"
  port: 12345

parsac:
  parsac_flag: false
  dynamic_probability: 0.15
  threshold: 1.0
  norm_scale: 1.0
  keyframe_check_size: 1

# [xrhires] official yaml has no initializer section => code default min_parallax 10 px; scaled x 1.5
initializer:
  min_parallax: 15.00
