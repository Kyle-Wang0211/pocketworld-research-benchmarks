name: PWSplatAB
options:
  bundleIdPrefix: com.kyle
  deploymentTarget:
    iOS: "16.0"
targets:
  PWSplatAB:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "lod/*.cpp"
      # LOD 引擎 + 原样引入的 LOD 库:按库自己的 -fno-exceptions -fno-rtti 编
      - path: Sources/lod/pw_lod_bench.cpp
        compilerFlags: ["-fno-exceptions", "-fno-rtti", "-ffp-contract=off", "-fno-fast-math", "-Wall", "-Wextra"]
      - path: third_party/aether_pointcloud_lod/src/octree.cpp
        compilerFlags: ["-fno-exceptions", "-fno-rtti", "-ffp-contract=off", "-fno-fast-math", "-Wall", "-Wextra"]
      - path: third_party/aether_pointcloud_lod/src/select.cpp
        compilerFlags: ["-fno-exceptions", "-fno-rtti", "-ffp-contract=off", "-fno-fast-math", "-Wall", "-Wextra"]
      - path: third_party/aether_pointcloud_lod/src/stream.cpp
        compilerFlags: ["-fno-exceptions", "-fno-rtti", "-ffp-contract=off", "-fno-fast-math", "-Wall", "-Wextra"]
    settings:
      base:
        DEVELOPMENT_TEAM: 26AH7V448L
        PRODUCT_BUNDLE_IDENTIFIER: com.kyle.PWSplatAB
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        CLANG_CXX_LIBRARY: "libc++"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_OPTIMIZATION_LEVEL: 3
        ENABLE_BITCODE: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/third_party/aether_pointcloud_lod/include
          - $(SRCROOT)/third_party/aether_pointcloud_lod/third_party
          - ~/Developer/Aether3D-cross/aether_cpp/third_party/dawn/include
          - ~/Developer/Aether3D-cross/aether_cpp/build-ios-device-dawn/third_party/dawn/gen/include
        OTHER_LDFLAGS:
          - -ObjC
          - -force_load
          - ~/Developer/Aether3D-cross/aether_cpp/build-ios-device-dawn/third_party/dawn/src/dawn/native/Release-iphoneos/libwebgpu_dawn.a
          - -lc++
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
