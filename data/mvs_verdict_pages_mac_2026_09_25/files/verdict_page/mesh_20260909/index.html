<meta charset="utf-8"><title>fuseCut 真彩网格 vs 裁决后点云 · 132 张</title>
<style>
 html,body{margin:0;background:#000;color:#ddd;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
 header{padding:8px 12px;background:#111;border-bottom:1px solid #222}
 h1{margin:0 0 4px;font-size:15px;color:#fff} .hint{color:#8a8a8a;font-size:12px}
 #ctl{display:flex;gap:14px;align-items:center;padding:6px 12px;background:#0d0d0d;
      border-bottom:1px solid #222;position:sticky;top:0;z-index:5}
 #grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#222;
       height:calc(100vh - 118px)}
 .pane{position:relative;background:#000;overflow:hidden}
 canvas{display:block;width:100%;height:100%}
 .cap{position:absolute;left:8px;top:6px;right:8px;pointer-events:none;text-shadow:0 1px 3px #000}
 .cap b{color:#fff;font-size:13px} .cap div{color:#b0b0b0;font-size:11px;margin-top:2px}
 .pts{position:absolute;left:8px;bottom:6px;color:#7a7a7a;font-size:11px;
      font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
 #bar{height:3px;background:#1a5fb4;width:0;transition:width .12s} #barw{background:#181818}
 label{color:#9a9a9a}
</style>
<header><h1>fuseCut 真彩网格 vs 裁决后点云 · 同坐标同相机 · 132 张</h1>
<div class="hint">网格 = aliceVision_meshing(Jancosek–Pajdla 2014 可见性图割)+ aliceVision_texturing --workingColorSpace linear --outputColorSpace srgb(8192² 图集);
点云 = 官方768 全量经同一网格裁决后剩下的 29,016,931 点。两窗共用一个相机,拖动同步。</div></header>
<div id="ctl">
 <label><input id="lit" type="checkbox"> 加明暗(默认关 = 官方图集原色,1:1 显示)</label>
 <span>点大小</span><input id="ps" type="range" min="0.5" max="4" step="0.1" value="1.3">
 <span id="msg" style="color:#8a8a8a"></span></div>
<div id="barw"><div id="bar"></div></div>
<div id="grid"></div>
<script>
// 相机/矩阵/交互逐字取自 build_page_cli.py(点云页用的同一套,保证两类页面手感一致)
const V={cx:0.5897371768951416,cy:-1.0425186157226562,cz:-3.504240036010742,radius:4.360073089599609};
const cam={az:0.6,el:0.35,dist:V.radius*2.4,tx:V.cx,ty:V.cy,tz:V.cz};
let PS=1.3, LIT=0;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lookAt(e,c,u){const f=nrm(sub(c,e)),s=nrm(crs(f,u)),v=crs(s,f);
 return [s[0],v[0],-f[0],0, s[1],v[1],-f[1],0, s[2],v[2],-f[2],0,
         -dot3(s,e),-dot3(v,e),dot3(f,e),1];}
function persp(fy,a,zn,zf){const t=1/Math.tan(fy/2);
 return [t/a,0,0,0, 0,t,0,0, 0,0,(zf+zn)/(zn-zf),-1, 0,0,2*zf*zn/(zn-zf),0];}
const mul=(A,B)=>{const O=new Array(16).fill(0);
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)for(let k=0;k<4;k++)O[c*4+r]+=A[k*4+r]*B[c*4+k];return O};
const bar=document.getElementById("bar"), msg=document.getElementById("msg");
function assertGpu(g,lab){
 if(!g||g.isContextLost())throw new Error(lab+" WebGL上下文不可用");
 const e=g.getError(); if(e!==g.NO_ERROR)throw new Error(lab+" WebGL错误 "+e);
}
function mkPane(name,subtitle,foot){
 const d=document.createElement("div"); d.className="pane";
 d.innerHTML=`<canvas></canvas><div class="cap"><b>${name}</b><div>${subtitle}</div></div>
   <div class="pts">${foot}</div>`;
 document.getElementById("grid").appendChild(d);
 const cv=d.querySelector("canvas"), gl=cv.getContext("webgl2",{antialias:true});
 if(!gl)throw new Error(name+" 需要 WebGL2");
 gl.enable(gl.DEPTH_TEST); gl.clearColor(0,0,0,1);
 return {d,cv,gl};
}
function prog(gl,vs,fs,lab){
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(lab+" 着色器: "+gl.getShaderInfoLog(o));return o};
 const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
 gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(lab+" 链接: "+gl.getProgramInfoLog(p));
 return p;
}
// ---------- 左:真彩网格 ----------
const MVS=`#version 300 es
 in vec3 p; in vec2 t; uniform mat4 mvp; out vec2 vt; out vec3 vp;
 void main(){gl_Position=mvp*vec4(p,1.0); vt=t; vp=p;}`;
const MFS=`#version 300 es
 precision highp float; in vec2 vt; in vec3 vp; uniform sampler2D tex;
 uniform vec3 eye; uniform float lit; out vec4 o;
 void main(){
  vec3 c=texture(tex,vt).rgb;
  vec3 n=normalize(cross(dFdx(vp),dFdy(vp)));      // 无法线属性 ⇒ 由屏幕导数取面法线
  float d=abs(dot(n,normalize(eye-vp)));
  o=vec4(c*mix(1.0,0.30+0.70*d,lit),1.0);
 }`;
const PVS=`attribute vec3 p;attribute vec3 c;uniform mat4 mvp;uniform float ps;varying vec3 vc;
 void main(){gl_Position=mvp*vec4(p,1.0);gl_PointSize=ps;vc=c;}`;
const PFS=`precision mediump float;varying vec3 vc;
 void main(){vec2 d=gl_PointCoord-vec2(0.5);if(dot(d,d)>0.25)discard;gl_FragColor=vec4(vc,1.0);}`;

const A=mkPane("① fuseCut 真彩网格","aliceVision_meshing + aliceVision_texturing(官方两步,MPL-2.0)",
               "2,581,829 三角形 / 1,266,394 顶点 · 8192² 纹理图集");
const B=mkPane("② 裁决后点云(全量)","官方768 CasDiffMVS 全量点云,被同一网格判为「表面内」的部分",
               "29,016,931 点 · 全分辨率,零降采样");

async function fetchProgress(url,lab,i,tot){
 const r=await fetch(url); if(!r.ok)throw new Error(lab+" HTTP "+r.status);
 const total=+r.headers.get("content-length")||0; const chunks=[]; let got=0;
 const rd=r.body.getReader();
 for(;;){const{done,value}=await rd.read(); if(done)break; chunks.push(value); got+=value.byteLength;
  if(total){bar.style.width=(100*(i+got/total)/tot)+"%"; msg.textContent=lab+" "+(100*got/total|0)+"%";}}
 const out=new Uint8Array(got); let o=0; for(const c of chunks){out.set(c,o);o+=c.byteLength;}
 return out;
}
async function loadMesh(i,tot){
 const raw=await fetchProgress("bin/mesh.glb","网格",i,tot);
 const dv=new DataView(raw.buffer);
 if(dv.getUint32(0,true)!==0x46546C67)throw new Error("不是 GLB");
 const jl=dv.getUint32(12,true);
 const gltf=JSON.parse(new TextDecoder().decode(raw.subarray(20,20+jl)));
 const binOff=20+jl+8;                       // JSON chunk 后是 BIN chunk 头(8字节)
 const bv=k=>{const v=gltf.bufferViews[k];
   return raw.subarray(binOff+v.byteOffset, binOff+v.byteOffset+v.byteLength);};
 const prim=gltf.meshes[0].primitives[0];
 const acc=gltf.accessors, g=A.gl;
 const pos=new Float32Array(bv(acc[prim.attributes.POSITION].bufferView).slice().buffer);
 const uv =new Float32Array(bv(acc[prim.attributes.TEXCOORD_0].bufferView).slice().buffer);
 const idx=new Uint32Array(bv(acc[prim.indices].bufferView).slice().buffer);
 msg.textContent="网格 解纹理…";
 const img=gltf.images[0];
 const bmp=await createImageBitmap(new Blob([bv(img.bufferView)],{type:img.mimeType}),
                                   {imageOrientation:"none"});
 const pr=prog(g,MVS,MFS,"网格");
 const vao=g.createVertexArray(); g.bindVertexArray(vao);
 const mk=(data,loc,n)=>{const b=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,b);
   g.bufferData(g.ARRAY_BUFFER,data,g.STATIC_DRAW);
   g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc,n,g.FLOAT,false,0,0);};
 mk(pos,g.getAttribLocation(pr,"p"),3); mk(uv,g.getAttribLocation(pr,"t"),2);
 const ib=g.createBuffer();
 g.bindBuffer(g.ELEMENT_ARRAY_BUFFER,ib); g.bufferData(g.ELEMENT_ARRAY_BUFFER,idx,g.STATIC_DRAW);
 g.bindVertexArray(null);
 const tx=g.createTexture(); g.bindTexture(g.TEXTURE_2D,tx);
 g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,bmp);
 g.generateMipmap(g.TEXTURE_2D);
 g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR_MIPMAP_LINEAR);
 g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
 assertGpu(g,"网格上传");
 A.pr=pr; A.vao=vao; A.tex=tx; A.count=idx.length;
 A.loc={mvp:g.getUniformLocation(pr,"mvp"),eye:g.getUniformLocation(pr,"eye"),
        lit:g.getUniformLocation(pr,"lit"),tex:g.getUniformLocation(pr,"tex")};
}
async function loadCloud(n,i,tot){
 const g=B.gl, pr=prog(g,PVS,PFS,"点云");
 const up=async(url,lab,stride,j)=>{
  const r=await fetch(url); if(!r.ok)throw new Error(lab+" HTTP "+r.status);
  const bytes=n*stride, b=g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER,b); g.bufferData(g.ARRAY_BUFFER,bytes,g.STATIC_DRAW);
  assertGpu(g,lab+" 分配");
  const rd=r.body.getReader(); let got=0;
  for(;;){const{done,value}=await rd.read(); if(done)break;
   if(got+value.byteLength>bytes)throw new Error(lab+" 数据越界");
   g.bindBuffer(g.ARRAY_BUFFER,b); g.bufferSubData(g.ARRAY_BUFFER,got,value); got+=value.byteLength;
   bar.style.width=(100*(i+j+got/bytes)/tot)+"%"; msg.textContent=lab+" "+(100*got/bytes|0)+"%";}
  if(got!==bytes)throw new Error(lab+" 不完整 "+got+"!="+bytes);
  return b;
 };
 const pb=await up("../fusecut_20260909/bin/fusecut.pos","点云 位置",12,0);
 const cb=await up("../fusecut_20260909/bin/fusecut.col","点云 颜色",3,1);
 B.pr=pr; B.pb=pb; B.cb=cb; B.n=n;
 B.loc={p:g.getAttribLocation(pr,"p"),c:g.getAttribLocation(pr,"c"),
        mvp:g.getUniformLocation(pr,"mvp"),ps:g.getUniformLocation(pr,"ps")};
}
(async()=>{ await loadMesh(0,3); await loadCloud(29016931,1,3);
 bar.style.width="0"; msg.textContent=""; document.body.dataset.ready="1";
})().catch(e=>{msg.textContent="加载失败："+e.message; console.error(e);});

function eyePos(){return [cam.tx+cam.dist*Math.cos(cam.el)*Math.sin(cam.az),
                          cam.ty+cam.dist*Math.sin(cam.el),
                          cam.tz+cam.dist*Math.cos(cam.el)*Math.cos(cam.az)];}
function frame(v){const {gl,cv}=v, w=cv.clientWidth,h=cv.clientHeight,dp=Math.min(devicePixelRatio||1,2);
 if(cv.width!==w*dp||cv.height!==h*dp){cv.width=w*dp;cv.height=h*dp;}
 gl.viewport(0,0,cv.width,cv.height); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const ce=eyePos();
 return {dp, mvp:mul(persp(1.0,cv.width/cv.height,V.radius*0.005,V.radius*40),
                     lookAt(ce,[cam.tx,cam.ty,cam.tz],[0,1,0])), ce};
}
function draw(){
 {const g=A.gl,f=frame(A);
  if(A.pr){g.useProgram(A.pr); g.bindVertexArray(A.vao);
   g.uniformMatrix4fv(A.loc.mvp,false,new Float32Array(f.mvp));
   g.uniform3fv(A.loc.eye,new Float32Array(f.ce)); g.uniform1f(A.loc.lit,LIT);
   g.activeTexture(g.TEXTURE0); g.bindTexture(g.TEXTURE_2D,A.tex); g.uniform1i(A.loc.tex,0);
   g.drawElements(g.TRIANGLES,A.count,g.UNSIGNED_INT,0); g.bindVertexArray(null);}}
 {const g=B.gl,f=frame(B);
  if(B.pr&&B.n){g.useProgram(B.pr);
   g.uniformMatrix4fv(B.loc.mvp,false,new Float32Array(f.mvp)); g.uniform1f(B.loc.ps,PS*f.dp);
   g.bindBuffer(g.ARRAY_BUFFER,B.pb); g.vertexAttribPointer(B.loc.p,3,g.FLOAT,false,0,0);
   g.enableVertexAttribArray(B.loc.p);
   g.bindBuffer(g.ARRAY_BUFFER,B.cb); g.vertexAttribPointer(B.loc.c,3,g.UNSIGNED_BYTE,true,0,0);
   g.enableVertexAttribArray(B.loc.c);
   g.drawArrays(g.POINTS,0,B.n);}}
 requestAnimationFrame(draw);
}
draw();
let drag=null;
addEventListener("mousedown",e=>{if(e.target.tagName==="CANVAS"){
 drag={x:e.clientX,y:e.clientY,b:e.button}; e.preventDefault();}});
addEventListener("mouseup",()=>drag=null);
addEventListener("mousemove",e=>{if(!drag)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
 if(drag.b===2){const k=cam.dist*0.0015;
  cam.tx-=k*(dx*Math.cos(cam.az)); cam.tz+=k*(dx*Math.sin(cam.az)); cam.ty+=k*dy;}
 else{cam.az-=dx*0.006; cam.el=Math.max(-1.5,Math.min(1.5,cam.el+dy*0.006));}});
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*0.001);},{passive:false});
document.getElementById("ps").oninput=e=>{PS=parseFloat(e.target.value);};
document.getElementById("lit").onchange=e=>{LIT=e.target.checked?1:0;};
</script>
